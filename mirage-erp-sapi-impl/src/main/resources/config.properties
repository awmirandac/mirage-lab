# Configuración de la aplicación. Sin secretos: esos van cifrados en secure.properties.
http.port=8081

# env decide qué secure-<env>.properties se carga (local | cloud). NO puede vivir aquí: Mule resuelve el
# nombre del archivo de secure properties antes de leer este archivo. Llega como system property:
#   local  → -M-Denv=local en mule.runtime.defaultArguments (y -Denv=local en munit.runtime.defaultArguments)
#   cloud  → env=cloud en deploy_ch2.json / Runtime Manager

# ERP simulado (PostgreSQL en Docker)
db.host=localhost
db.port=5432
db.name=mirage_erp
db.user=mirage
# TLS hacia la base: disable en Docker local; require en Neon (se pisa desde la nube)
db.sslmode=disable

# Feed de inventario (módulo 6.5): carpeta donde se escriben los JSON por almacén
feed.dir=C:/Users/awmiranda/Desktop/Avatar/Mulesoft/Mirage/feeds
feed.frequency.minutes=5

# Consola APIkit (/console): started para desarrollo local; en la nube se pone stopped desde Runtime Manager
api.console.state=started

# API Manager (módulo 9): ID de la API instance. Cambia por ambiente; en la nube se pisa desde Runtime Manager
api.id=21182046
