openapi: 3.0.3

info:
  title: Mirage ERP System API
  version: 1.0.0
  description: |
    System API que expone el inventario de minisplits del ERP de Mirage.

    **Capa:** system. No contiene lógica de negocio: devuelve el dato crudo del ERP.
    La combinación con cobertura de instalación ocurre en la Process API.
  contact:
    name: Equipo de Integraciones Mirage
    email: integraciones@avatar-global.com

servers:
  - url: https://api.mirage.mx/erp/v1
    description: Producción
  - url: https://api-sandbox.mirage.mx/erp/v1
    description: Sandbox

# Ambas credenciales son obligatorias: al ir en el mismo objeto, se exigen en conjunto.
security:
  - clientId: []
    clientSecret: []

tags:
  - name: Inventario
    description: Consulta de existencias en el ERP.

paths:
  /products/{sku}/availability:
    get:
      operationId: getProductAvailability
      summary: Consultar disponibilidad
      tags: [ Inventario ]
      description: |
        Devuelve las existencias del SKU desglosadas por almacén, según el último
        corte de inventario del ERP.

        No determina si el producto es vendible: eso depende también de la cobertura
        de instalación, que resuelve la Process API.
      parameters:
        - name: sku
          in: path
          required: true
          description: SKU del producto en el catálogo de Mirage.
          schema:
            type: string
            pattern: '^MIRAGE-[A-Z0-9-]+$'
            example: MIRAGE-MS-12K
      responses:
        '200':
          description: Disponibilidad encontrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Availability'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

components:

  #-----------------------------------------------------------------
  # Seguridad: dos cabeceras, emitidas por API Manager al firmar el contrato
  #-----------------------------------------------------------------
  securitySchemes:
    clientId:
      type: apiKey
      in: header
      name: client_id
      description: Identificador de la aplicación cliente.
    clientSecret:
      type: apiKey
      in: header
      name: client_secret
      description: Secreto de la aplicación cliente.

  #-----------------------------------------------------------------
  # Esquemas
  #-----------------------------------------------------------------
  schemas:

    Warehouse:
      type: object
      description: Existencia de un SKU en un almacén concreto.
      required: [ code, name, quantity ]
      properties:
        code:
          type: string
          description: Código del almacén en el ERP.
          example: CDMX-01
        name:
          type: string
          description: Nombre legible del almacén.
          example: Centro de distribución Vallejo
        quantity:
          type: integer
          minimum: 0
          description: Unidades disponibles en este almacén.
          example: 9

    Availability:
      type: object
      description: Disponibilidad de un SKU según el inventario del ERP.
      required: [ sku, available, quantity, warehouses, updatedAt ]
      properties:
        sku:
          type: string
          pattern: '^MIRAGE-[A-Z0-9-]+$'
          description: SKU del producto en el catálogo de Mirage.
          example: MIRAGE-MS-12K
        capacityBtu:
          type: integer
          description: Capacidad de enfriamiento del equipo, en BTU.
          example: 12000
        available:
          type: boolean
          description: true si hay al menos una unidad en cualquier almacén.
          example: true
        quantity:
          type: integer
          minimum: 0
          description: Suma de existencias en todos los almacenes.
          example: 14
        warehouses:
          type: array
          description: Desglose por almacén.
          items:
            $ref: '#/components/schemas/Warehouse'
        updatedAt:
          type: string
          format: date-time
          description: Momento del último corte de inventario en el ERP.
          example: '2026-09-10T18:30:00Z'
      example:
        sku: MIRAGE-MS-12K
        capacityBtu: 12000
        available: true
        quantity: 14
        warehouses:
          - code: CDMX-01
            name: Centro de distribución Vallejo
            quantity: 9
          - code: MTY-02
            name: Bodega Apodaca
            quantity: 5
        updatedAt: '2026-09-10T18:30:00Z'

    Error:
      type: object
      description: |
        Formato único de error para todas las APIs de Mirage.
        Candidato natural a convertirse en fragmento reutilizable (módulo 3).
      required: [ code, message, timestamp ]
      properties:
        code:
          type: string
          description: Código estable, apto para que el consumidor decida sobre él.
          example: SKU_NOT_FOUND
        message:
          type: string
          description: Descripción legible. No apta para lógica de negocio.
          example: No existe el SKU solicitado en el catálogo del ERP.
        timestamp:
          type: string
          format: date-time
          description: Momento en que se produjo el error.
          example: '2026-09-10T18:30:00Z'
        traceId:
          type: string
          description: Identificador de correlación para rastrear la petición.
          example: 7f3a1c9e-4b2d-4e8a-9c1f-2a5b6d8e0f13

  #-----------------------------------------------------------------
  # Respuestas reutilizables: el equivalente al trait de RAML
  #-----------------------------------------------------------------
  responses:

    BadRequest:
      description: La petición no cumple el contrato.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: INVALID_SKU_FORMAT
            message: El SKU debe seguir el patrón MIRAGE-XX-NNN.
            timestamp: '2026-09-10T18:30:00Z'

    Unauthorized:
      description: Credenciales ausentes o inválidas.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: UNAUTHORIZED
            message: client_id o client_secret ausentes o inválidos.
            timestamp: '2026-09-10T18:30:00Z'

    NotFound:
      description: El SKU no existe en el catálogo del ERP.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: SKU_NOT_FOUND
            message: No existe el SKU solicitado en el catálogo del ERP.
            timestamp: '2026-09-10T18:30:00Z'

    ServerError:
      description: Error no controlado, o el ERP no respondió.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: ERP_UNAVAILABLE
            message: El sistema de inventario no está disponible en este momento.
            timestamp: '2026-09-10T18:30:00Z'
