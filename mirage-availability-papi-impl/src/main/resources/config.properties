# Configuración de la aplicación. Sin secretos (el client_secret va cifrado en secure-<env>.properties).
# Puerto local: 8083 (8081 = erp, 8082 = logistics). En CloudHub se pisa con http.port=8081.
http.port=8083

# Consola APIkit: started en local; stopped en la nube
api.console.state=started

# API Manager: ID de la API instance (se completa al registrar la API; cambia por ambiente)
api.id=21188164

# System APIs que consume esta Process API.
# ACB solo corre una app a la vez, así que en local se apunta a las System APIs ya desplegadas en CloudHub
# (con políticas activas: las credenciales de la PAPI sí se validan). Para probar contra localhost:8081/8082
# harían falta tres runtimes (Studio o mvn), o mockear con MUnit.
erp.host=mirage-erp-sapi-6bdyqf.5sc6y6-3.usa-e2.cloudhub.io
erp.port=443
erp.protocol=HTTPS
logistics.host=mirage-logistics-sapi-6bdyqf.5sc6y6-4.usa-e2.cloudhub.io
logistics.port=443
logistics.protocol=HTTPS

# Identidad de esta app como consumidor (client application "Mirage Availability PAPI" en Exchange)
papi.client.id=184c5e77e14440d89889652a7fbe8086
